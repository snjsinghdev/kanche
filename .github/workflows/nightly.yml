# The full suite every night (03:00 IST) on days main changed, and on demand: everything in CI
# with 10,000 harness seeds, plus a dependency audit every night. The iOS simulator build runs
# only when the nightly is dispatched by hand (macOS minutes count 10x; ADR-0001).
name: Nightly

on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        name: Did main change in the last 25 hours?
        env:
          EVENT: ${{ github.event_name }}
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$age" -lt 90000 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "main unchanged for ${age}s; skipping the full suite."
          fi

  ci:
    name: ci
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      harness_seeds: 10000

  ios:
    name: ios
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ios.yml

  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
